<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR-код iSKRA Tour</title>
    <meta name="description" content="QR-код iSKRA Tour для быстрого перехода на страницу контактов.">
    <meta property="og:type" content="website">
    <meta property="og:title" content="QR-код iSKRA Tour">
    <meta property="og:description" content="Быстрый переход на страницу контактов iSKRA Tour.">
    <meta property="og:image" content="https://iskra-tour.ru/images/qr/contacts-qr.svg">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="iSKRA Tour">
    <link rel="apple-touch-icon" href="../images/qr/logo_square.png">
    <link rel="icon" type="image/png" href="../images/qr/logo_square.png">
    <style>
        :root {
            --shadow: 0 28px 70px rgba(84, 38, 73, 0.16);
        }

        * { box-sizing: border-box; }

        html {
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: start center;
            padding: 25px 24px 24px;
            overflow-x: hidden;
            background:
                radial-gradient(circle at top left, rgba(255, 255, 255, 0.95), transparent 30%),
                radial-gradient(circle at top right, rgba(255, 185, 210, 0.45), transparent 22%),
                linear-gradient(135deg, #fffafc 0%, #fff2f7 45%, #ffe3ef 100%);
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            border-radius: 9999px;
            filter: blur(72px);
            pointer-events: none;
            z-index: 0;
            opacity: 0.5;
        }

        body::before {
            width: 320px;
            height: 320px;
            top: 4%;
            left: -80px;
            background: radial-gradient(circle, rgba(255, 170, 208, 0.55), rgba(255, 170, 208, 0));
        }

        body::after {
            width: 380px;
            height: 380px;
            right: -110px;
            bottom: 6%;
            background: radial-gradient(circle, rgba(255, 205, 229, 0.68), rgba(255, 205, 229, 0));
        }

        .qr-shell {
            position: relative;
            z-index: 1;
            width: min(100%, 520px);
            border-radius: 36px;
            padding: 22px;
            border: 1px solid rgba(255, 255, 255, 0.76);
            background:
                linear-gradient(150deg, rgba(255, 255, 255, 0.92), rgba(255, 242, 247, 0.88)),
                linear-gradient(135deg, rgba(255, 185, 210, 0.2), rgba(255, 255, 255, 0));
            backdrop-filter: blur(16px);
            box-shadow: var(--shadow);
        }

        .qr-shell::before {
            content: "";
            position: absolute;
            inset: 14px;
            border-radius: 28px;
            border: 1px solid rgba(255, 255, 255, 0.72);
            pointer-events: none;
        }

        .qr-image {
            position: relative;
            z-index: 1;
            display: block;
            width: 100%;
            height: auto;
            border-radius: 22px;
            background: #fff;
        }

        @media (max-width: 640px) {
            body { padding: 25px 14px 14px; }
            .qr-shell {
                border-radius: 28px;
                padding: 16px;
            }
            .qr-shell::before {
                inset: 10px;
                border-radius: 22px;
            }
            .qr-image {
                border-radius: 18px;
            }
        }
    </style>
</head>
<body>
    <main class="qr-shell">
        <img class="qr-image" src="../images/qr/contacts-qr.svg" alt="QR-код на страницу contacts iSKRA Tour">
    </main>
</body>
</html>
